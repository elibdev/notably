basePath: /api/v1
definitions:
  handlers.AuthResponse:
    properties:
      expires_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: user123
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      user_id:
        example: user123
        type: string
    required:
    - password
    - user_id
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        minLength: 8
        type: string
      user_id:
        example: user123
        type: string
    required:
    - email
    - password
    - user_id
    type: object
  models.CreateEntityRequest:
    properties:
      fields:
        additionalProperties: true
        type: object
    required:
    - fields
    type: object
  models.CreateTableRequest:
    properties:
      fields:
        items:
          $ref: '#/definitions/models.FieldRequest'
        minItems: 1
        type: array
      id:
        example: users_table
        type: string
    required:
    - fields
    - id
    type: object
  models.EntityListResponse:
    properties:
      entities:
        items:
          $ref: '#/definitions/models.EntityResponse'
        type: array
    type: object
  models.EntityResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      deleted_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      entity_id:
        example: entity_123
        type: string
      fields:
        additionalProperties: true
        type: object
      is_deleted:
        example: false
        type: boolean
      table_id:
        example: users_table
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: Invalid request
        type: string
    type: object
  models.FieldChangeResponse:
    properties:
      entity_id:
        example: entity123
        type: string
      new_value:
        example: new_name
        type: string
      old_value:
        example: old_name
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
    type: object
  models.FieldHistoryResponse:
    properties:
      changes:
        items:
          $ref: '#/definitions/models.FieldChangeResponse'
        type: array
      field_name:
        example: user_name
        type: string
      table_id:
        example: users_table
        type: string
    type: object
  models.FieldRequest:
    properties:
      data_type:
        enum:
        - string
        - int
        - float
        - bool
        - date
        - json
        - reference
        example: string
        type: string
      name:
        example: user_name
        type: string
    required:
    - data_type
    - name
    type: object
  models.FieldResponse:
    properties:
      data_type:
        example: string
        type: string
      name:
        example: user_name
        type: string
    type: object
  models.HealthResponse:
    properties:
      status:
        example: healthy
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  models.TableHistoryResponse:
    properties:
      changes:
        items:
          $ref: '#/definitions/models.Tuple'
        type: array
      table_id:
        example: users_table
        type: string
    type: object
  models.TableListResponse:
    properties:
      tables:
        items:
          $ref: '#/definitions/models.TableResponse'
        type: array
    type: object
  models.TableResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      fields:
        items:
          $ref: '#/definitions/models.FieldResponse'
        type: array
      id:
        example: users_table
        type: string
      updated_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      user_id:
        example: user123
        type: string
    type: object
  models.Tuple:
    properties:
      entity_id:
        type: string
      field_name:
        type: string
      gsi1_pk:
        description: GSI keys for different query patterns
        type: string
      gsi1_sk:
        description: '{timestamp}#{entityID}'
        type: string
      gsi2_pk:
        description: USER#{userID}#{tableID}#{entityID}
        type: string
      gsi2_sk:
        description: '{timestamp}#{fieldName}'
        type: string
      gsi3_pk:
        description: USER#{userID}#{tableID}
        type: string
      gsi3_sk:
        description: '{entityID}#{timestamp}#{fieldName}'
        type: string
      pk:
        description: DynamoDB keys
        type: string
      sk:
        description: 'Sort key: TUPLE#{tableID}#{entityID}#{timestamp}#{fieldName}'
        type: string
      table_id:
        type: string
      timestamp:
        type: string
      user_id:
        type: string
      value:
        type: string
    type: object
  models.UpdateEntityRequest:
    properties:
      fields:
        additionalProperties: true
        type: object
    required:
    - fields
    type: object
  models.UpdateTableRequest:
    properties:
      fields:
        items:
          $ref: '#/definitions/models.FieldRequest'
        minItems: 1
        type: array
    required:
    - fields
    type: object
  models.UserInfoResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      updated_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      user_id:
        example: user123
        type: string
    type: object
