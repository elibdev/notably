basePath: /api/v1
definitions:
  handlers.AuthResponse:
    properties:
      expires_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user_id:
        example: user123
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      password:
        example: password123
        type: string
      user_id:
        example: user123
        type: string
    required:
    - password
    - user_id
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: password123
        minLength: 8
        type: string
      user_id:
        example: user123
        type: string
    required:
    - email
    - password
    - user_id
    type: object
  models.CreateEntityRequest:
    properties:
      fields:
        additionalProperties: true
        type: object
    required:
    - fields
    type: object
  models.CreateTableRequest:
    properties:
      fields:
        items:
          $ref: '#/definitions/models.FieldRequest'
        minItems: 1
        type: array
      id:
        example: users_table
        type: string
    required:
    - fields
    - id
    type: object
  models.EntityListResponse:
    properties:
      entities:
        items:
          $ref: '#/definitions/models.EntityResponse'
        type: array
    type: object
  models.EntityResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      deleted_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      entity_id:
        example: entity_123
        type: string
      fields:
        additionalProperties: true
        type: object
      is_deleted:
        example: false
        type: boolean
      table_id:
        example: users_table
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
    type: object
  models.ErrorResponse:
    properties:
      error:
        example: Invalid request
        type: string
    type: object
  models.FieldChangeResponse:
    properties:
      entity_id:
        example: entity123
        type: string
      new_value:
        example: new_name
        type: string
      old_value:
        example: old_name
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
    type: object
  models.FieldHistoryResponse:
    properties:
      changes:
        items:
          $ref: '#/definitions/models.FieldChangeResponse'
        type: array
      field_name:
        example: user_name
        type: string
      table_id:
        example: users_table
        type: string
    type: object
  models.FieldRequest:
    properties:
      data_type:
        enum:
        - string
        - int
        - float
        - bool
        - date
        - json
        - reference
        example: string
        type: string
      name:
        example: user_name
        type: string
    required:
    - data_type
    - name
    type: object
  models.FieldResponse:
    properties:
      data_type:
        example: string
        type: string
      name:
        example: user_name
        type: string
    type: object
  models.HealthResponse:
    properties:
      status:
        example: healthy
        type: string
      timestamp:
        example: "2023-12-31T23:59:59Z"
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  models.SuccessResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
    type: object
  models.TableHistoryResponse:
    properties:
      changes:
        items:
          $ref: '#/definitions/models.Tuple'
        type: array
      table_id:
        example: users_table
        type: string
    type: object
  models.TableListResponse:
    properties:
      tables:
        items:
          $ref: '#/definitions/models.TableResponse'
        type: array
    type: object
  models.TableResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      fields:
        items:
          $ref: '#/definitions/models.FieldResponse'
        type: array
      id:
        example: users_table
        type: string
      updated_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      user_id:
        example: user123
        type: string
    type: object
  models.Tuple:
    properties:
      entity_id:
        type: string
      field_name:
        type: string
      gsi1_pk:
        description: GSI keys for different query patterns
        type: string
      gsi1_sk:
        description: '{timestamp}#{entityID}'
        type: string
      gsi2_pk:
        description: USER#{userID}#{tableID}#{entityID}
        type: string
      gsi2_sk:
        description: '{timestamp}#{fieldName}'
        type: string
      gsi3_pk:
        description: USER#{userID}#{tableID}
        type: string
      gsi3_sk:
        description: '{entityID}#{timestamp}#{fieldName}'
        type: string
      pk:
        description: DynamoDB keys
        type: string
      sk:
        description: 'Sort key: TUPLE#{tableID}#{entityID}#{timestamp}#{fieldName}'
        type: string
      table_id:
        type: string
      timestamp:
        type: string
      user_id:
        type: string
      value:
        type: string
    type: object
  models.UpdateEntityRequest:
    properties:
      fields:
        additionalProperties: true
        type: object
    required:
    - fields
    type: object
  models.UpdateTableRequest:
    properties:
      fields:
        items:
          $ref: '#/definitions/models.FieldRequest'
        minItems: 1
        type: array
    required:
    - fields
    type: object
  models.UserInfoResponse:
    properties:
      created_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      updated_at:
        example: "2023-12-31T23:59:59Z"
        type: string
      user_id:
        example: user123
        type: string
    type: object
externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is the Notably API server for managing time-series data and entities.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Notably API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Login user
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email and password
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a new user
      tags:
      - authentication
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is healthy
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /ready:
    get:
      consumes:
      - application/json
      description: Check if the service is ready to accept requests
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service not ready
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Readiness check
      tags:
      - health
  /tables:
    get:
      consumes:
      - application/json
      description: Get a list of all tables for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: List of tables
          schema:
            $ref: '#/definitions/models.TableListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: List all tables
      tags:
      - tables
    post:
      consumes:
      - application/json
      description: Create a new table with field definitions
      parameters:
      - description: Table creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateTableRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Table created successfully
          schema:
            $ref: '#/definitions/models.TableResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new table
      tags:
      - tables
  /tables/{tableId}:
    delete:
      consumes:
      - application/json
      description: Delete a table by its ID
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Table deleted successfully
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete table
      tags:
      - tables
    get:
      consumes:
      - application/json
      description: Retrieve a specific table by its ID
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Table information
          schema:
            $ref: '#/definitions/models.TableResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Table not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get table by ID
      tags:
      - tables
    put:
      consumes:
      - application/json
      description: Update table field definitions
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Table update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Table updated successfully
          schema:
            $ref: '#/definitions/models.TableResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Table not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Update table
      tags:
      - tables
  /tables/{tableId}/entities:
    get:
      consumes:
      - application/json
      description: Get a list of all entities in the specified table with optional
        time-based filtering
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Point-in-time query (RFC3339 format)
        in: query
        name: asOf
        type: string
      - description: Maximum number of entities to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of entities
          schema:
            $ref: '#/definitions/models.EntityListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: List entities in a table
      tags:
      - entities
    post:
      consumes:
      - application/json
      description: Create a new entity in the specified table
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateEntityRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Entity created successfully
          schema:
            $ref: '#/definitions/models.EntityResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new entity
      tags:
      - entities
  /tables/{tableId}/entities/{entityId}:
    delete:
      consumes:
      - application/json
      description: Mark an entity as deleted (soft delete)
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Entity deleted successfully
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Entity not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete entity
      tags:
      - entities
    get:
      consumes:
      - application/json
      description: Retrieve a specific entity by its ID with optional point-in-time
        query
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityId
        required: true
        type: string
      - description: Point-in-time query (RFC3339 format)
        in: query
        name: asOf
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entity information
          schema:
            $ref: '#/definitions/models.EntityResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Entity not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get entity by ID
      tags:
      - entities
    put:
      consumes:
      - application/json
      description: Update an existing entity's fields
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityId
        required: true
        type: string
      - description: Entity update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateEntityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Entity updated successfully
          schema:
            $ref: '#/definitions/models.EntityResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Entity not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Update entity
      tags:
      - entities
  /tables/{tableId}/entities/{entityId}/history:
    get:
      consumes:
      - application/json
      description: Retrieve the history of changes for a specific entity
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityId
        required: true
        type: string
      - description: Maximum number of history entries to return
        in: query
        name: limit
        type: integer
      - description: Start date for history (RFC3339 format)
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Entity history
          schema:
            $ref: '#/definitions/models.EntityListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Entity not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get entity history
      tags:
      - entities
  /tables/{tableId}/entities/{entityId}/undelete:
    post:
      consumes:
      - application/json
      description: Restore a previously deleted entity
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Entity ID
        in: path
        name: entityId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Entity undeleted successfully
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Entity not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Undelete entity
      tags:
      - entities
  /tables/{tableId}/history:
    get:
      consumes:
      - application/json
      description: Retrieve the history of changes for a specific table
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Start date for history (RFC3339 format)
        in: query
        name: since
        type: string
      - description: Maximum number of history entries to return
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Table history
          schema:
            $ref: '#/definitions/models.TableHistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get table history
      tags:
      - tables
  /tables/{tableId}/history/fields/{fieldName}:
    get:
      consumes:
      - application/json
      description: Retrieve the history of changes for a specific field in a table
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Field name
        in: path
        name: fieldName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Field history
          schema:
            $ref: '#/definitions/models.FieldHistoryResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get field history
      tags:
      - tables
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieve the current authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: User information
          schema:
            $ref: '#/definitions/models.UserInfoResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get current user information
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the current authenticated user's profile information
      produces:
      - application/json
      responses:
        "200":
          description: User updated successfully
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "501":
          description: Not implemented
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Update current user profile
      tags:
      - users
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
