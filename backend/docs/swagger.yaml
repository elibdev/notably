info:
  contact:
    email: support@notably.dev
    name: Notably API Support
    url: https://github.com/elibdev/notably
  description: "# Notably API - Time-Series Data Management Platform\n\n**Notably**
    is a powerful time-series database API that allows you to create dynamic data
    schemas, store entities with flexible fields, and query historical states of your
    data. Perfect for applications requiring audit trails, versioning, and time travel
    capabilities.\n\n## \U0001F680 Key Features\n\n### \U0001F4CA **Dynamic Table
    Management**\n- Create tables with custom field schemas (string, int, float, bool,
    date, json, reference)\n- Add/remove fields dynamically without downtime\n- Full
    schema evolution tracking\n\n### \U0001F5C3️ **Flexible Entity Storage**\n- Store
    entities with any combination of fields\n- Real-time CRUD operations\n- Soft delete
    with undelete capabilities\n- Field-level operations (add, update, delete individual
    fields)\n\n### ⏰ **Time Travel & History**\n- Query data as it existed at any
    point in time using `asOf` parameters\n- Complete audit trail for all changes\n-
    Field-level history tracking\n- Entity and table history endpoints\n\n### \U0001F510
    **Secure Authentication**\n- JWT-based authentication\n- User registration and
    login\n- Per-user data isolation\n\n## \U0001F4D6 Usage Examples\n\n### Basic
    Workflow\n```\n1. Register/Login → Get JWT token\n2. Create a table → Define your
    schema\n3. Add entities → Store your data\n4. Query & update → Manage your data\n5.
    Time travel → View historical states\n```\n\n### Example: Creating a User Directory\n```json\n//
    1. Create table\nPOST /tables\n{\n\"id\": \"users\",\n\"fields\": [\n{\"name\":
    \"name\", \"data_type\": \"string\"},\n{\"name\": \"email\", \"data_type\": \"string\"},\n{\"name\":
    \"age\", \"data_type\": \"int\"},\n{\"name\": \"active\", \"data_type\": \"bool\"}\n]\n}\n\n//
    2. Add user\nPOST /tables/users/entities\n{\n\"fields\": {\n\"name\": \"John Doe\",\n\"email\":
    \"john@example.com\",\n\"age\": 30,\n\"active\": true\n}\n}\n\n// 3. Query historical
    state\nGET /tables/users/entities?asOf=2023-12-01T10:00:00Z\n```\n\n## \U0001F50D
    Time Travel Queries\n\nAdd `asOf` parameter to any entity query to see data as
    it existed at that time:\n- `GET /tables/users/entities?asOf=2023-12-01T10:00:00Z`\n-
    `GET /tables/users/entities/123?asOf=2023-12-01T10:00:00Z`\n\n## \U0001F4DA Response
    Formats\n\nAll timestamps use **RFC3339** format: `2023-12-31T23:59:59Z`\n\nStandard
    response structure:\n- **Success**: HTTP 200/201/204 with data\n- **Error**: HTTP
    4xx/5xx with `{\"error\": \"description\"}`\n\n## \U0001F6E0️ Development\n\n-
    **Environment**: Go 1.23+\n- **Database**: DynamoDB (local or AWS)\n- **Auth**:
    JWT tokens (HS256)\n- **Testing**: Comprehensive integration tests included"
