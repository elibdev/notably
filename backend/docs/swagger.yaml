  title: Notably API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        ## User Authentication

        Authenticates an existing user and returns a JWT token for accessing protected endpoints.
        The token is valid for a limited time and must be included in the Authorization header
        for all subsequent API calls.

        ### Example Request
        ```json
        {
        "user_id": "john_doe_2024",
        "password": "SecurePass123!"
        }
        ```

        ### Example Success Response
        ```json
        {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "expires_at": "2024-01-01T12:00:00Z",
        "user_id": "john_doe_2024"
        }
        ```

        ### Using the Token
        Add the token to the Authorization header for protected endpoints:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

        ### Token Expiration
        Tokens have a limited lifetime. When a token expires, you'll receive a 401 Unauthorized
        response and need to login again to get a new token.
      parameters:
      - description: User login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful with JWT token
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid request format or missing fields
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid user_id or password
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error during authentication
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Authenticate user and get access token
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: |-
        ## Register New User

        Creates a new user account in the Notably system. Upon successful registration,
        returns a JWT token that can be used immediately for authentication.

        ### Requirements
        - **user_id**: Unique identifier (3-50 characters, alphanumeric and underscores)
        - **password**: Minimum 8 characters
        - **email**: Valid email address format

        ### Example Request
        ```json
        {
        "user_id": "john_doe_2024",
        "password": "SecurePass123!",
        "email": "john.doe@company.com"
        }
        ```

        ### Example Success Response
        ```json
        {
        "token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...",
        "expires_at": "2024-01-01T12:00:00Z",
        "user_id": "john_doe_2024"
        }
        ```

        ### Usage After Registration
        Include the token in subsequent API calls:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully with JWT token
          schema:
            $ref: '#/definitions/handlers.AuthResponse'
        "400":
          description: Invalid request data (missing fields, invalid email, weak password)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: User with this user_id already exists
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error during user creation
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a new user account
      tags:
      - authentication
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is healthy
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            $ref: '#/definitions/models.HealthResponse'
      summary: Health check
      tags:
      - health
  /ready:
    get:
      consumes:
      - application/json
      description: Check if the service is ready to accept requests
      produces:
      - application/json
      responses:
        "200":
          description: Service is ready
          schema:
            $ref: '#/definitions/models.HealthResponse'
        "503":
          description: Service not ready
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Readiness check
      tags:
      - health
  /tables:
    get:
      consumes:
      - application/json
      description: |-
        ## List User Tables

        Retrieves all tables owned by the authenticated user. Each table includes
        its schema definition, creation time, and metadata. Use this endpoint to
        discover available tables before working with entities.

        ### Example Success Response
        ```json
        {
        "tables": [
        {
        "id": "customers",
        "user_id": "john_doe_2024",
        "fields": [
        {"name": "name", "data_type": "string"},
        {"name": "email", "data_type": "string"},
        {"name": "active", "data_type": "bool"}
        ],
        "created_at": "2024-01-01T12:00:00Z",
        "updated_at": "2024-01-01T12:00:00Z"
        },
        {
        "id": "products",
        "user_id": "john_doe_2024",
        "fields": [
        {"name": "title", "data_type": "string"},
        {"name": "price", "data_type": "float"},
        {"name": "in_stock", "data_type": "bool"}
        ],
        "created_at": "2024-01-01T13:00:00Z",
        "updated_at": "2024-01-01T13:00:00Z"
        }
        ]
        }
        ```

        ### Use Cases
        - Dashboard overview of all data schemas
        - Table picker for entity management interfaces
        - Schema discovery for dynamic form generation
      produces:
      - application/json
      responses:
        "200":
          description: List of all user tables with schemas
          schema:
            $ref: '#/definitions/models.TableListResponse'
        "401":
          description: Authentication required - missing or invalid Bearer token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error retrieving tables
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get all tables for the current user
      tags:
      - tables
    post:
      consumes:
      - application/json
      description: |-
        ## Create Table

        Creates a new table with a custom field schema. Tables define the structure
        for your entities and support dynamic field types including strings, numbers,
        booleans, dates, JSON objects, and references to other entities.

        ### Supported Field Types
        - **string**: Text data (names, descriptions, etc.)
        - **int**: Integer numbers
        - **float**: Decimal numbers
        - **bool**: True/false values
        - **date**: RFC3339 timestamps
        - **json**: Complex nested objects/arrays
        - **reference**: Links to other entities

        ### Example Request
        ```json
        {
        "id": "customers",
        "fields": [
        {"name": "name", "data_type": "string"},
        {"name": "email", "data_type": "string"},
        {"name": "age", "data_type": "int"},
        {"name": "active", "data_type": "bool"},
        {"name": "created_date", "data_type": "date"},
        {"name": "metadata", "data_type": "json"}
        ]
        }
        ```

        ### Example Success Response
        ```json
        {
        "id": "customers",
        "user_id": "john_doe_2024",
        "fields": [
        {"name": "name", "data_type": "string"},
        {"name": "email", "data_type": "string"}
        ],
        "created_at": "2024-01-01T12:00:00Z",
        "updated_at": "2024-01-01T12:00:00Z"
        }
        ```

        ### Next Steps
        After creating a table, you can:
        - Add entities: `POST /tables/{id}/entities`
        - Update schema: `PUT /tables/{id}`
        - Query data: `GET /tables/{id}/entities`
      parameters:
      - description: Table creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateTableRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Table created successfully
          schema:
            $ref: '#/definitions/models.TableResponse'
        "400":
          description: Invalid request data (missing fields, invalid field types)
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Authentication required - include Bearer token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error during table creation
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Create a new data table with custom schema
      tags:
      - tables
  /tables/{tableId}:
    delete:
      consumes:
      - application/json
      description: Delete a table by its ID
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Table deleted successfully
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Delete table
      tags:
      - tables
    get:
      consumes:
      - application/json
      description: |-
        ## Get Table Details

        Retrieves comprehensive information about a specific table, including
        its complete schema definition, field types, and metadata. Use this
        endpoint to understand the structure before creating or querying entities.

        ### Example Request
        ```
        GET /tables/customers
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

        ### Example Success Response
        ```json
        {
        "id": "customers",
        "user_id": "john_doe_2024",
        "fields": [
        {"name": "name", "data_type": "string"},
        {"name": "email", "data_type": "string"},
        {"name": "age", "data_type": "int"},
        {"name": "active", "data_type": "bool"},
        {"name": "metadata", "data_type": "json"}
        ],
        "created_at": "2024-01-01T12:00:00Z",
        "updated_at": "2024-01-01T12:00:00Z"
        }
        ```

        ### Use Cases
        - Validate table schema before entity operations
        - Generate dynamic forms based on field definitions
        - Table management interfaces
        - Schema documentation and discovery
      parameters:
      - description: Unique table identifier
        in: path
        name: tableId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Complete table information with schema
          schema:
            $ref: '#/definitions/models.TableResponse'
        "401":
          description: Authentication required - missing or invalid Bearer token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Table not found or access denied
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get detailed information about a specific table
      tags:
      - tables
    put:
      consumes:
      - application/json
      description: Update table field definitions
      parameters:
      - description: Table ID
        in: path
        name: tableId
        required: true
        type: string
      - description: Table update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTableRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Table updated successfully
          schema:
            $ref: '#/definitions/models.TableResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Table not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Update table
      tags:
      - tables
  /tables/{tableId}/entities:
    get:
      consumes:
      - application/json
      description: |-
        ## List Table Entities

        Retrieves all active (non-deleted) entities from the specified table.
        Supports powerful time travel queries to see entities as they existed
        at any point in the past using the `asOf` parameter.

        ### Time Travel Queries
        Use the `asOf` parameter to query historical data:
        - `asOf=2024-01-01T12:00:00Z` - See entities as they were at noon on Jan 1st
        - Without `asOf` - Get current state (most recent data)

        ### Example Request (Current State)
        ```
        GET /tables/employees/entities?limit=10
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

        ### Example Request (Historical State)
        ```
        GET /tables/employees/entities?asOf=2024-01-01T12:00:00Z&limit=50
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        ```

        ### Example Success Response
        ```json
        {
        "entities": [
        {
        "entity_id": "01HWQR3K2N8X9YZ123ABC456EF",
        "table_id": "employees",
        "fields": {
        "name": "John Doe",
        "email": "john.doe@company.com",
        "active": true
        },
        "is_deleted": false,
        "created_at": "2024-01-01T12:00:00Z",
        "timestamp": "2024-01-01T14:30:00Z"
        }
        ]
        }
        ```

        ### Use Cases
        - Dashboard data display
        - Data export functionality
        - Historical analysis and reporting
        - Compliance audits with time travel
      parameters:
      - description: Unique table identifier
        in: path
        name: tableId
        required: true
        type: string
      - description: Point-in-time query timestamp (RFC3339 format, e.g., 2024-01-01T12:00:00Z)
        in: query
        name: asOf
        type: string
      - description: 'Maximum number of entities to return (default: 100, max: 1000)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of active entities, optionally filtered by time
          schema:
            $ref: '#/definitions/models.EntityListResponse'
        "401":
          description: Authentication required - missing or invalid Bearer token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error retrieving entities
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - Bearer: []
      summary: Get all entities in a table with time travel support
      tags:
      - entities
    post:
      consumes:
      - application/json
      description: |-
        ## Create Entity

        Creates a new entity in the specified table with flexible field values.
        The entity will automatically get a unique ID and timestamp. All changes
        are tracked in the history system for audit trails and time travel queries.

        ### Field Value Types
        Entity fields can contain any JSON-compatible values:
        - **Strings**: Text, emails, descriptions
        - **Numbers**: Integers and floats
        - **Booleans**: true/false values
        - **Objects**: Nested JSON structures
        - **Arrays**: Lists of values
        - **Null**: Empty/undefined values

        ### Example Request
        ```json
        {
        "fields": {
        "name": "John Doe",
        "email": "john.doe@company.com",
        "age": 30,
        "active": true,
        "metadata": {
        "department": "engineering",
        "level": "senior",
        "skills": ["Go", "React", "PostgreSQL"]
        },
        "hire_date": "2024-01-15T09:00:00Z"
        }
        }
        ```

        ### Example Success Response
        ```json
        {
        "entity_id": "01HWQR3K2N8X9YZ123ABC456EF",
        "table_id": "employees",
        "fields": {
        "name": "John Doe",
        "email": "john.doe@company.com",
        "age": 30,
        "active": true,
        "metadata": {
        "department": "engineering",
        "level": "senior"
        }
        },
        "is_deleted": false,
        "created_at": "2024-01-01T12:00:00Z",
        "timestamp": "2024-01-01T12:00:00Z"
        }
        ```

        ### Next Steps
        - Update entity: `PUT /tables/{tableId}/entities/{entityId}`
        - Query entity: `GET /tables/{tableId}/entities/{entityId}`
        - View history: `GET /tables/{tableId}/entities/{entityId}/history`
      parameters:
